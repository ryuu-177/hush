<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9eae2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)">
<title>Hush · 暂时连不上</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<style>
/* 英文 / 数字字体（已在 service worker 里缓存，断网也能用） */
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/font-001.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url("/fonts/font-002.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url("/fonts/font-003.woff2") format("woff2")}

/* ENDFIELD 终端皮肤 · 与主界面同一套令牌 */
:root{--bg:#e9eae2;--card:#f4f3eb;--fg:#1c2923;--mut:#6c7c70;--line:#c4cdbf;--ac:#d9e84f;--ink:#111613;--grid:rgba(37,65,41,.05)}
@media(prefers-color-scheme:dark){body{background-image:url(/bg/hush-dark.svg)!important}:root{--bg:#111413;--card:#181d1c;--fg:#ecf0e8;--mut:#77867c;--line:#343e39;--grid:rgba(192,213,192,.035)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.7 "Space Grotesk","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--fg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background-image:url(/bg/hush-light.svg);background-size:1600px 1000px;-webkit-tap-highlight-color:transparent}
.box{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;padding:30px 28px 26px;background:color-mix(in srgb,var(--card) 78%,transparent);border:1px solid var(--line);border-radius:28px;-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 30px 70px -28px rgba(0,0,0,.45);animation:in .5s cubic-bezier(.16,1,.3,1)}
.box::before{content:"SIGNAL LOST / 连接中断";font:600 10px "Space Grotesk",monospace;letter-spacing:.24em;color:var(--mut);padding-bottom:14px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px}.logo img{width:100%;height:100%;display:block}
h1{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:.02em}
h1::after{content:"";display:block;width:40px;height:3px;background:var(--ac);margin-top:12px}
p{margin:0;color:var(--mut);font-size:13.5px}
.st{display:flex;align-items:center;gap:10px;font:600 11px "Space Grotesk",monospace;letter-spacing:.14em;color:var(--mut);min-height:18px;text-transform:uppercase}
.st i{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:pulse 1.2s steps(2) infinite}
button{margin-top:6px;padding:13px 22px;border:0;background:var(--ac);color:var(--ink);font:700 13px "Space Grotesk","PingFang SC",sans-serif;letter-spacing:.2em;cursor:pointer;border-radius:999px;background:linear-gradient(180deg,#eaf58f,#d6e64c 52%,#c8da3c);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 22px -12px rgba(150,172,20,.55)}
button:hover{filter:brightness(1.05)}button:disabled{opacity:.55}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.box,.st i{animation:none}}
</style>
</head>
<body>
<div class="box" id="offline">
  <div class="logo"><img src="/icons/icon-192.png" alt=""></div>
  <h1>暂时连不上服务器</h1>
  <p id="why">服务器电脑可能关机了，或者网络断开。<br>恢复后会自动进入 Hush。</p>
  <div class="st"><i></i><span id="st">正在等待服务器…</span></div>
  <button id="retry" type="button">立即重试</button>
</div>
<script>
(() => {
  const st = document.getElementById('st'), why = document.getElementById('why'), btn = document.getElementById('retry');
  let wait = 3000, timer = 0;
  function paint() {
    if (!navigator.onLine) { why.innerHTML = '你的设备没有连上网络。<br>连上网络后会自动进入 Hush。'; st.textContent = '等待网络…'; }
    else { why.innerHTML = '服务器电脑可能关机了，或者网络断开。<br>恢复后会自动进入 Hush。'; st.textContent = '正在等待服务器…'; }
  }
  async function check(manual) {
    clearTimeout(timer);
    if (manual) { btn.disabled = true; st.textContent = '正在连接…'; }
    try {
      const r = await fetch('/api/ping', { cache: 'no-store' });
      if (r.ok && (await r.json()).ok) { st.textContent = '已恢复，正在进入…'; location.reload(); return; }
    } catch (_) {}
    btn.disabled = false; paint();
    wait = manual ? 3000 : Math.min(wait * 1.5, 15000);
    timer = setTimeout(check, wait);
  }
  btn.onclick = () => check(true);
  addEventListener('online', () => check(true));
  addEventListener('offline', paint);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  paint(); timer = setTimeout(check, wait);
})();
</script>
</body>
</html>
